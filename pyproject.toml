[project]
name = "ai4science-benchmarking"
version = "0.1.0"
description = "Modular, open-source benchmarking suite for evaluating AI co-scientist tools (Next GenAI Cures)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.2.0",
    "pypdf>=4.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# LLM-as-judge / extraction backends (pick what you need; all are optional).
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# Local models served by Ollama (judge, extraction, and/or embeddings) — no
# API key, no network call, everything runs on your machine.
ollama = ["ollama>=0.4"]
# Local scientific embedding backends (SPECTER2, SciBERT, general models).
local-embeddings = ["sentence-transformers>=3.0"]
# Exploratory notebooks (e.g. embedding visualization) -- not needed to run
# the pipeline itself.
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "matplotlib>=3.9", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarking_pipeline"]

[project.scripts]
benchmarking = "benchmarking_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
